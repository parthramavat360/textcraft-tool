<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="SVG Compressor Tool – Optimize SVG vector graphics online">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a24c"/>
      <stop offset="100%" stop-color="#e8c56d"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a24c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8c56d" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="0"/>

  <!-- Ambient decorative circles -->
  <circle cx="680" cy="80" r="160" fill="url(#goldDim)"/>
  <circle cx="120" cy="420" r="100" fill="url(#goldDim)"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#d4a24c" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#d4a24c" stroke-width="0.5"/>
  </g>

  <!-- Main card -->
  <g filter="url(#shadow)" transform="translate(120, 90)">
    <rect x="0" y="0" width="560" height="320" rx="16" fill="#0e0e18" stroke="rgba(212,162,76,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="560" height="320" rx="16" fill="url(#cardGlow)"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="560" height="44" rx="16" fill="rgba(212,162,76,0.04)"/>
    <circle cx="20" cy="22" r="4" fill="#d4a24c" opacity="0.3"/>
    <circle cx="36" cy="22" r="4" fill="#d4a24c" opacity="0.15"/>
    <circle cx="52" cy="22" r="4" fill="#d4a24c" opacity="0.1"/>

    <!-- SVG preview area - vector graphic -->
    <g transform="translate(40, 70)">
      <!-- Vector shape - star/polygon -->
      <polygon points="120,10 150,50 200,60 170,100 175,150 120,130 65,150 70,100 40,60 90,50" fill="rgba(212,162,76,0.08)" stroke="url(#gold)" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Inner shape -->
      <polygon points="120,40 135,60 160,66 145,85 148,115 120,105 92,115 95,85 80,66 105,60" fill="rgba(212,162,76,0.04)" stroke="url(#gold)" stroke-width="0.8" stroke-linejoin="round" opacity="0.6"/>

      <!-- Circle decorations -->
      <circle cx="120" cy="80" r="20" fill="none" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>

      <!-- Connection lines -->
      <line x1="120" y1="10" x2="240" y2="30" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>
      <line x1="200" y1="60" x2="240" y2="30" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>
      <line x1="175" y1="150" x2="240" y2="140" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>
      <line x1="65" y1="150" x2="20" y2="140" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>
      <line x1="40" y1="60" x2="20" y2="30" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>
      <line x1="90" y1="50" x2="20" y2="30" stroke="rgba(212,162,76,0.08)" stroke-width="0.5"/>

      <!-- Nodes -->
      <circle cx="240" cy="30" r="3" fill="#d4a24c" opacity="0.3"/>
      <circle cx="240" cy="140" r="3" fill="#d4a24c" opacity="0.3"/>
      <circle cx="20" cy="140" r="3" fill="#d4a24c" opacity="0.3"/>
      <circle cx="20" cy="30" r="3" fill="#d4a24c" opacity="0.3"/>

      <!-- Brackets indicating markup -->
      <text x="280" y="30" fill="rgba(212,162,76,0.2)" font-size="10" font-weight="400" font-family="monospace">&lt;svg&gt;</text>
      <text x="280" y="50" fill="rgba(255,255,255,0.04)" font-size="9" font-weight="400" font-family="monospace">  &lt;path d="..."/&gt;</text>
      <text x="280" y="68" fill="rgba(255,255,255,0.04)" font-size="9" font-weight="400" font-family="monospace">  &lt;circle cx="120"/&gt;</text>
      <text x="280" y="86" fill="rgba(255,255,255,0.04)" font-size="9" font-weight="400" font-family="monospace">  &lt;polygon points="..."/&gt;</text>
      <text x="280" y="110" fill="rgba(212,162,76,0.2)" font-size="10" font-weight="400" font-family="monospace">&lt;/svg&gt;</text>
    </g>

    <!-- Optimization stats bar at bottom -->
    <g transform="translate(40, 250)">
      <rect x="0" y="0" width="480" height="40" rx="20" fill="rgba(212,162,76,0.04)" stroke="rgba(212,162,76,0.06)" stroke-width="0.5"/>

      <!-- Before size -->
      <text x="20" y="17" fill="rgba(255,255,255,0.3)" font-size="9" font-weight="500" font-family="system-ui">BEFORE</text>
      <text x="20" y="32" fill="rgba(255,255,255,0.5)" font-size="12" font-weight="600" font-family="system-ui">12.4 KB</text>

      <!-- Arrow -->
      <path d="M140 20 L180 20" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M174 16 L182 20 L174 24" stroke="url(#gold)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

      <!-- After size -->
      <text x="210" y="17" fill="#4c7cd4" font-size="9" font-weight="500" font-family="system-ui">AFTER</text>
      <text x="210" y="32" fill="#d4a24c" font-size="12" font-weight="700" font-family="system-ui">3.8 KB</text>

      <!-- Savings pill -->
      <rect x="320" y="8" width="80" height="24" rx="12" fill="rgba(76,212,124,0.08)" stroke="rgba(76,212,124,0.12)" stroke-width="0.5"/>
      <text x="360" y="24" text-anchor="middle" fill="rgba(76,212,124,0.7)" font-size="9" font-weight="700" font-family="system-ui">-69%</text>

      <!-- Clean code indicator -->
      <circle cx="440" cy="20" r="6" fill="rgba(76,212,124,0.1)"/>
      <path d="M438 20 L442 24 L446 17" stroke="rgba(76,212,124,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Decorative elements -->
  <line x1="60" y1="60" x2="60" y2="440" stroke="url(#gold)" stroke-width="1" opacity="0.1"/>
  <line x1="740" y1="60" x2="740" y2="440" stroke="url(#gold)" stroke-width="1" opacity="0.1"/>

  <circle cx="420" cy="60" r="1.5" fill="#d4a24c" opacity="0.2"/>
  <circle cx="680" cy="440" r="1.5" fill="#d4a24c" opacity="0.15"/>
  <circle cx="100" cy="460" r="1" fill="#d4a24c" opacity="0.2"/>
</svg>
